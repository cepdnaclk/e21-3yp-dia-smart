 server:
  port: 8080

 spring:
  datasource:
    url: jdbc:postgresql://localhost:5432/diasmart
    username: postgres
    password: ${DB_PASSWORD:}
    driver-class-name: org.postgresql.Driver

    jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        "[format_sql]": true

 logging:
  level:
    "[org.springframework.security]": INFO
    "[org.hibernate.SQL]": DEBUG

 app:
  encryption:
    key: ${ENCRYPTION_KEY:dev-secret-key-must-be-32-chars!}
  jwt:
    secret: ${JWT_SECRET:}
    expiration-ms: ${JWT_EXPIRATION_MS:3600000}

 mqtt:
  broker:
    ssl: ${MQTT_BROKER}

  client:
    id: diasmart-backend-dev

  topic: ${MQTT_TOPIC} 

 diasmart:
  ai:
    enabled: ${AI_ENABLED:false}
    gateway-url: ${AI_GATEWAY_URL:http://127.0.0.1:8000}
    internal-service-token: ${AI_INTERNAL_SERVICE_TOKEN:}
    connect-timeout: ${AI_CONNECT_TIMEOUT:3s}
    read-timeout: ${AI_READ_TIMEOUT:30s}
    max-date-range-days: ${AI_MAX_DATE_RANGE_DAYS:31}
    max-alerts: ${AI_MAX_ALERTS:100}
    max-selected-events: ${AI_MAX_SELECTED_EVENTS:100}
    prompt-version: ${AI_PROMPT_VERSION:clinical-summary-v1}
    expected-provider: ${AI_EXPECTED_PROVIDER:mock}