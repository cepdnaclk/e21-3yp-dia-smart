name: Deploy Backend to EC2

on:
  push:
    branches:
      - develop
    paths:
      - 'backend/**'

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Deploy to EC2
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            set -e

            echo "Go to project directory..."
            cd /home/ubuntu/e21-3yp-dia-smart

            echo "Pull latest code..."
            git fetch origin
            git reset --hard origin/develop

            echo "Go to backend project..."
            cd backend/spring-api

            echo "Build Spring Boot project..."
            mvn clean package -Dmaven.test.skip=true

            echo "Copy JAR file..."
            sudo cp target/springapi-0.0.1-SNAPSHOT.jar /opt/diasmart-backend/springapi-0.0.1-SNAPSHOT.jar

            echo "Restart backend service..."
            sudo systemctl restart diasmart

            echo "Check service status..."
            sudo systemctl status diasmart --no-pager

            echo "Backend deployment completed successfully."